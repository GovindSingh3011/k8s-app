apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-app-deployment
  namespace: k8s-app
  labels:
    app: k8s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-app
  template:
    metadata:
      labels:
        app: k8s-app
    spec:
      containers:
      - name: k8s-app-container
        image: govindsingh3011/k8s-app:latest
        ports:
        - containerPort: 3000